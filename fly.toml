# fly.toml — Bybit Vol Surge bot
# Region: sin (Singapore) — closest to Bybit's matching infra for low order latency.
app = 'bybit-volsurge-bot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  DATA_DIR = '/data'
  SYMBOL = 'BTCUSDT'
  BYBIT_INTERVAL = '1'
  BYBIT_TESTNET = 'false'
  PAPER_MODE = 'true'
  # ── Strategy: live pick (82.3% WR, PF 9.28 backtest) ──
  MIN_BODY_PTS = '50.0'
  VS_BURST_MULT = '2.0'
  MAX_PRE_ENTRY_SLIP_PTS = '40.0'
  FIXED_SL_PTS = '100.0'
  FIXED_TP_PTS = '50.0'
  LOT_SIZE = '0.001'           # BTC — validation size; scale up after proven

# Secrets (DO NOT put here) — set via:
#   fly secrets set BYBIT_API_KEY=... BYBIT_API_SECRET=... TELEGRAM_BOT_TOKEN=... TELEGRAM_CHAT_ID=...

[[mounts]]
  source = 'bybit_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
